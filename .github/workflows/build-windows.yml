name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Prepare bundled runtime (Node + dsh)
        working-directory: windows
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: Install dev dependencies
        working-directory: windows
        run: npm ci

      - name: Build NSIS installer
        working-directory: windows
        run: npx electron-builder --win nsis --x64 --publish never

      # 打包后自检: 直接断言 win-unpacked(NSIS 压缩前的原始目录,
      # afterPack 钩子作用于此, 与安装包装载逐文件一致)中 dsh 启动
      # 链上的关键文件都在。历史上 after-pack 按目录名误删过
      # @standard-schema/spec 与 yaml/dist/doc, 导致 Windows 版后端
      # 启动即 MODULE_NOT_FOUND 崩溃循环(用户侧"无法正常使用")。
      # 这道闸门保证同类回归在 CI 就红, 而不是发到 Release 才发现。
      - name: Verify installer payload
        working-directory: windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = 'dist\win-unpacked'
          if (-not (Test-Path (Join-Path $appDir 'resources'))) { throw "win-unpacked 结构异常: 缺少 resources" }
          $nm = Join-Path $appDir 'resources\runtime\dsh\node_modules'
          $required = @(
            (Join-Path $appDir 'resources\runtime\node\node.exe'),
            (Join-Path $nm '@deepseek-ai\dsh\lib\bin.js'),
            (Join-Path $nm '@standard-schema\spec\package.json'),
            (Join-Path $nm 'yaml\dist\doc\Document.js'),
            (Join-Path $nm 'yaml\dist\index.js')
          )
          foreach ($full in $required) {
            if (-not (Test-Path $full)) {
              Write-Host "node_modules 顶层(前 40 项):"
              Get-ChildItem $nm -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.Name)" }
              throw "安装包缺少关键运行时文件: $full (疑似 after-pack 误删)"
            }
            Write-Host "OK: $full"
          }

      - name: Update release assets (clobber)
        working-directory: windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag="v$ver"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 不存在, 跳过自动更新"
            exit 0
          fi
          exe="$(ls dist/*.exe | head -1)"
          name="$(basename "$exe")"
          # Git Bash 没有 shasum, 用 sha256sum(输出格式同为 "hash  文件名")
          sha256sum "$exe" > "$name.sha256"
          gh release upload "$tag" "$exe" "dist/latest.yml" "dist/$name.blockmap" "$name.sha256" --clobber
          echo "Release $tag 资产已更新"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Cute-Windows-x64
          path: |
            windows/dist/*.exe
            windows/dist/latest.yml
            windows/dist/*.blockmap
          if-no-files-found: error
