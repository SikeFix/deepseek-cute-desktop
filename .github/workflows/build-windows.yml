name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Prepare bundled runtime (Node + dsh)
        working-directory: windows
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: Install dev dependencies
        working-directory: windows
        run: npm ci

      - name: Build NSIS installer
        working-directory: windows
        run: npx electron-builder --win nsis --x64 --publish never

      # 打包后自检: 解开安装包装载, 断言 dsh 启动链上的关键文件都在。
      # 历史上 after-pack 按目录名误删过 @standard-schema/spec 与
      # yaml/dist/doc, 导致 Windows 版后端启动即 MODULE_NOT_FOUND
      # 崩溃循环(用户侧表现为"无法正常使用")。这道闸门保证同类
      # 回归在 CI 就红, 而不是发到 Release 之后才发现。
      - name: Verify installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $7z = 'C:\Program Files\7-Zip\7z.exe'
          $exe = (Get-ChildItem 'windows\dist\*.exe' | Select-Object -First 1).FullName
          $stage = Join-Path $env:RUNNER_TEMP 'nsis-verify'
          & $7z x -y -o$stage $exe | Out-Null
          $payload = (Get-ChildItem $stage -Recurse -Filter 'app-64.7z' | Select-Object -First 1).FullName
          $appDir = Join-Path $env:RUNNER_TEMP 'nsis-verify-app'
          & $7z x -y -o$appDir $payload | Out-Null
          $nm = 'resources\runtime\dsh\node_modules'
          $required = @(
            'resources\runtime\node\node.exe',
            "$nm\@deepseek-ai\dsh\lib\bin.js",
            "$nm\@standard-schema\spec\package.json",
            "$nm\yaml\dist\doc\Document.js",
            "$nm\yaml\dist\index.js"
          )
          foreach ($rel in $required) {
            if (-not (Test-Path (Join-Path $appDir $rel))) {
              throw "安装包缺少关键运行时文件: $rel (疑似 after-pack 误删)"
            }
            Write-Host "OK: $rel"
          }

      - name: Update release assets (clobber)
        working-directory: windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag="v$ver"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 不存在, 跳过自动更新"
            exit 0
          fi
          exe="$(ls dist/*.exe | head -1)"
          name="$(basename "$exe")"
          shasum -a 256 "$exe" > "$name.sha256"
          gh release upload "$tag" "$exe" "dist/latest.yml" "dist/$name.blockmap" "$name.sha256" --clobber
          echo "Release $tag 资产已更新"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Cute-Windows-x64
          path: |
            windows/dist/*.exe
            windows/dist/latest.yml
            windows/dist/*.blockmap
          if-no-files-found: error
