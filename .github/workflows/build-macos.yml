name: build-macos
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Build and verify signed app bundle
        run: BUILD_OUTPUT=build-macos bash macos/scripts/build.sh
      - name: Smoke test packaged runtime
        run: node scripts/smoke-runtime.mjs build-macos/DeepSeek.app/Contents/Resources/Runtime/bin/node build-macos/DeepSeek.app/Contents/Resources/Runtime/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
      - name: Upload release assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          ver=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/Info.plist)
          gh release upload "v$ver" "build-macos/DeepSeek-M2-$ver.dmg" "build-macos/DeepSeek-M2-$ver.dmg.sha256" --clobber
