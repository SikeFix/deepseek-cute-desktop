<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { width: min(520px, calc(100vw - 48px)); padding: 32px; text-align: center; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; }
  h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
  p { margin: 10px 0; color: GrayText; line-height: 1.6; }
  button { margin: 18px 6px 0; padding: 9px 16px; border: 1px solid color-mix(in srgb, CanvasText 28%, transparent); border-radius: 7px; color: ButtonText; background: ButtonFace; cursor: pointer; }
  #error { display: none; text-align: left; white-space: pre-wrap; word-break: break-word; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>DeepSeek</h1>
  <p id="message">正在等待本地服务启动…</p>
  <p id="service-text">正在准备服务</p>
  <p id="error"></p>
  <button id="retry">重试</button><button id="diag">复制诊断信息</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const message = params.get('message'); if (message) document.querySelector('#message').textContent = message;
  const errorEl = document.querySelector('#error'); const error = params.get('error');
  if (error) { errorEl.textContent = error; errorEl.style.display = 'block'; }
  document.querySelector('#retry').onclick = () => window.deepseekDesktop?.recoverService?.();
  document.querySelector('#diag').onclick = async () => { const file = await window.deepseekDesktop?.copyDiagnostics?.(); document.querySelector('#diag').textContent = file ? '已复制' : '复制失败'; };
  window.deepseekDesktop?.onServiceStatus?.((status) => { document.querySelector('#service-text').textContent = status.message || status.state || ''; });
  window.deepseekDesktop?.getStatus?.().then(({service}) => { document.querySelector('#service-text').textContent = service.message || service.state || ''; }).catch(() => {});
</script>
</body>
</html>
