<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题工坊</title>
<style>
  :root { color-scheme: light; --accent:#f36b50; --sun:#f5dc26; --mint:#62e8d3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#faf7f0; color:#30261f; }
  header { display:flex; align-items:center; gap:12px; padding:16px 22px; border-bottom:1px solid #eadfcd; background:#fffdf8; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:#8a7a68; font-size:12px; }
  header .close { margin-left:auto; width:30px; height:30px; border:0; border-radius:9px; background:#f0e8d8; cursor:pointer; font-size:15px; }
  header .close:hover { background:#f6d7d2; }
  .layout { display:grid; grid-template-columns: 350px 1fr; gap:0; min-height:calc(100vh - 63px); }
  .panel { padding:20px 22px; overflow-y:auto; max-height:calc(100vh - 63px); }
  .panel.left { border-right:1px solid #eadfcd; background:#fffdf8; }
  .field { margin-bottom:16px; }
  .field > label { display:block; font-size:12px; font-weight:700; color:#6e5d50; margin-bottom:7px; }
  input[type="text"], textarea { width:100%; padding:9px 11px; border:1.5px solid #ddceb8; border-radius:10px; font:13px inherit; background:#fff; outline:none; }
  input[type="text"]:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(243,107,80,.12); }
  textarea { resize:vertical; min-height:56px; }
  .colors { display:flex; gap:10px; }
  .colorpick { flex:1; text-align:center; }
  .colorpick input[type="color"] { width:100%; height:44px; border:2px solid #e6d9c2; border-radius:12px; padding:3px; background:#fff; cursor:pointer; }
  .colorpick span { font-size:11px; color:#8a7a68; display:block; margin-top:5px; }
  .seg { display:flex; background:#f0e8d8; border-radius:11px; padding:3px; }
  .seg button { flex:1; border:0; background:transparent; padding:7px 0; border-radius:8px; font:700 12px inherit; color:#8a7a68; cursor:pointer; }
  .seg button.on { background:#fff; color:#30261f; box-shadow:0 2px 6px rgba(60,45,20,.12); }
  .wallbox { border:1.5px dashed #d8c8a8; border-radius:12px; padding:12px; text-align:center; background:#fff; min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .wallbox img { max-width:100%; max-height:120px; border-radius:8px; }
  .wallbox .hint { font-size:11px; color:#a09080; }
  .wallbox .row { display:flex; gap:8px; }
  .mini { border:1px solid #d8c8a8; background:#fff; border-radius:8px; padding:5px 10px; font:600 11px inherit; cursor:pointer; color:#6e5d50; }
  .mini:hover { border-color:var(--accent); color:var(--accent); }
  .phrases { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { display:inline-flex; align-items:center; gap:5px; background:#f6efe1; border:1px solid #e6d9c2; padding:4px 9px; border-radius:999px; font-size:11px; }
  .chip b { cursor:pointer; color:#b08968; font-weight:900; }
  .preset-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .preset { border:2px solid #e6d9c2; border-radius:13px; padding:10px; cursor:pointer; background:#fff; text-align:center; }
  .preset:hover { border-color:var(--accent); transform:translateY(-1px); }
  .preset .sw { display:flex; height:26px; border-radius:7px; overflow:hidden; margin-bottom:7px; }
  .preset .sw i { flex:1; }
  .preset div { font-size:11px; font-weight:700; color:#6e5d50; }
  .actions { display:flex; gap:10px; margin-top:20px; }
  .btn { flex:1; border:0; border-radius:11px; padding:11px 0; font:800 13px inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; box-shadow:3px 4px 0 rgba(245,220,38,.6); }
  .btn.primary:disabled { opacity:.5; cursor:wait; }
  .btn.ghost { background:#f0e8d8; color:#6e5d50; }
  .status { font-size:12px; margin-top:10px; min-height:16px; color:#1f9d6c; font-weight:700; }
  .status.err { color:#bf342d; }
  /* 预览区 */
  .preview { padding:18px; }
  .preview h3 { margin:0 0 10px; font-size:13px; color:#8a7a68; }
  .pv-stage { border-radius:16px; overflow:hidden; border:1px solid #e6d9c2; min-height:420px; display:flex; flex-direction:column; box-shadow:0 14px 40px rgba(80,60,30,.14); }
  .pv-frame { flex:1; display:flex; background:var(--pv-wall); color:var(--pv-label); }
  .pv-side { width:170px; background:var(--pv-col); padding:14px 10px; border-right:1px solid var(--pv-border); }
  .pv-brand { display:flex; align-items:center; gap:8px; background:var(--pv-l1); border:2px solid var(--pv-border2); border-radius:12px; padding:8px; margin-bottom:12px; }
  .pv-mascot { width:30px; height:30px; border-radius:9px; background:var(--pv-mascot); flex:0 0 30px; }
  .pv-brand b { font-size:12px; }
  .pv-item { border-radius:8px; padding:6px 8px; font-size:11px; color:var(--pv-label2); margin-bottom:4px; }
  .pv-item.sel { background:var(--pv-sel); box-shadow:inset 3px 0 0 var(--pv-accent); color:var(--pv-label); }
  .pv-main { flex:1; display:flex; flex-direction:column; padding:14px; gap:10px; background:var(--pv-center); }
  .pv-titlebar { display:flex; align-items:center; justify-content:space-between; }
  .pv-doc { font-size:12px; font-weight:800; }
  .pv-mode { font-size:10px; background:var(--pv-l1); border:1px solid var(--pv-border); padding:3px 8px; border-radius:999px; }
  .pv-bubble { font-size:12px; line-height:1.6; background:var(--pv-read); border-radius:12px; padding:10px 12px; color:var(--pv-readlabel); }
  .pv-composer { margin-top:auto; display:flex; align-items:center; gap:8px; background:var(--pv-l1); border:2px solid var(--pv-border2); border-radius:14px; padding:9px 11px; }
  .pv-input { flex:1; font-size:11px; color:var(--pv-label2); }
  .pv-send { width:26px; height:26px; border-radius:50%; background:var(--pv-accent); box-shadow:2px 3px 0 var(--pv-sun); display:grid; place-items:center; color:var(--pv-ink); font-size:12px; }
  .pv-btn { font-size:10px; border:1px solid var(--pv-border2); background:var(--pv-l1); color:var(--pv-accent); border-radius:8px; padding:4px 8px; }
  /* 自定义主题列表 */
  .saves { margin-top:18px; }
  .saves h3 { margin:0 0 8px; font-size:13px; color:#8a7a68; }
  .save-row { display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid #e6d9c2; border-radius:12px; padding:9px 12px; margin-bottom:8px; }
  .save-row .dot { width:14px; height:14px; border-radius:5px; flex:0 0 14px; }
  .save-row .nm { font-size:12px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .save-row button { border:0; background:transparent; cursor:pointer; font-size:11px; font-weight:700; padding:4px 8px; border-radius:7px; }
  .save-row .apply { color:#1f9d6c; } .save-row .apply:hover { background:#e5f5ef; }
  .save-row .del { color:#bf342d; } .save-row .del:hover { background:#fbe9e6; }
  .empty { font-size:12px; color:#a09080; text-align:center; padding:14px 0; }
</style>
</head>
<body>
<header>
  <h1>🎨 主题工坊</h1>
  <span class="sub">上传图片与文案，保存属于你的界面主题</span>
  <button class="close" id="close" title="关闭">✕</button>
</header>
<div class="layout">
  <div class="panel left">
    <div class="field"><label>主题名称</label><input type="text" id="name" maxlength="20" placeholder="例如：我的星空"></div>
    <div class="field"><label>主题色</label>
      <div class="colors">
        <div class="colorpick"><input type="color" id="cAccent" value="#f36b50"><span>主色</span></div>
        <div class="colorpick"><input type="color" id="cSun" value="#f5dc26"><span>强调</span></div>
        <div class="colorpick"><input type="color" id="cMint" value="#62e8d3"><span>点缀</span></div>
      </div>
    </div>
    <div class="field"><label>基础色调</label>
      <div class="seg" id="modeSeg">
        <button data-mode="dark" class="on">深色</button>
        <button data-mode="light">浅色</button>
      </div>
    </div>
    <div class="field"><label>背景图片（可选）</label>
      <div class="wallbox" id="wallbox">
        <div class="hint">上传一张喜欢的图片作为主题壁纸<br>支持 JPG / PNG，自动压缩</div>
        <div class="row" style="margin-top:8px">
          <button class="mini" id="pickWall">上传图片</button>
          <button class="mini" id="clearWall" style="display:none">移除图片</button>
        </div>
        <input type="file" id="wallFile" accept="image/*" hidden>
      </div>
    </div>
    <div class="field"><label>小组件形象（可选）</label>
      <div class="wallbox" id="mascotBox">
        <div class="hint">上传吉祥物图片，用作侧栏头像、欢迎页形象<br>以及桌面小宠物和应用图标 · 建议方形 PNG</div>
        <div class="row" style="margin-top:8px">
          <button class="mini" id="pickMascot">上传图片</button>
          <button class="mini" id="clearMascot" style="display:none">移除图片</button>
        </div>
        <input type="file" id="mascotFile" accept="image/*" hidden>
      </div>
    </div>
    <div class="field"><label>欢迎文案（服务启动页展示）</label>
      <textarea id="welcome" maxlength="60" placeholder="例如：正在为你准备今天的灵感…"></textarea>
    </div>
    <div class="field"><label>小助手口头禅（点击宠物时的回复，回车添加）</label>
      <input type="text" id="phraseInput" maxlength="20" placeholder="输入一句，回车添加">
      <div class="phrases" id="phraseList"></div>
    </div>
    <div class="field"><label>从预设出发</label>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="save">保存主题</button>
      <button class="btn ghost" id="saveApply">保存并使用</button>
    </div>
    <div class="status" id="status"></div>
    <div class="saves">
      <h3>已保存的主题</h3>
      <div id="saveList"><div class="empty">还没有自定义主题</div></div>
    </div>
  </div>
  <div class="panel preview">
    <h3>实时预览</h3>
    <div class="pv-stage"><div class="pv-frame" id="pvFrame">
      <div class="pv-side">
        <div class="pv-brand"><div class="pv-mascot"></div></div>
        <div class="pv-item sel">适配新API接入文档</div>
        <div class="pv-item">你好</div>
        <div class="pv-item">前端设计</div>
        <div class="pv-item">whatsapp</div>
        <div class="pv-item">远程修复 111.68.9.74</div>
      </div>
      <div class="pv-main">
        <div class="pv-titlebar"><span class="pv-doc">适配新API接入文档标题</span><span class="pv-mode">标准模式</span></div>
        <div class="pv-bubble" id="pvBubble">你好！主题预览会随你的配色实时更新，背景图、按钮、文字都会套上新主题。</div>
        <div style="display:flex;gap:8px"><span class="pv-btn">📋 复制</span><span class="pv-btn">👍</span><span class="pv-btn">🌿 分支</span></div>
        <div class="pv-composer"><span class="pv-input">给智能体发消息…</span><span class="pv-send">↑</span></div>
      </div>
    </div></div>
  </div>
</div>

<script>
const THEME_META = /*__THEME_META__*/null;;
const TOKENS = THEME_META.tokens;
const TEMPLATE = THEME_META.template;

/* ---------------- 平台桥 ----------------
   回复通道用独立的 replyId 字段: 主题 payload 自身带 id(主题 ID),
   若沿用同一个 id 字段会被 payload 覆盖, 导致宿主回复落空、前端永远超时。 */
function bridgeCall(action, payload = {}) {
  if (window.themeStudio && window.themeStudio.call) return window.themeStudio.call(action, payload);
  return new Promise((resolve) => {
    const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    window.__dsmStudioReplies = window.__dsmStudioReplies || {};
    window.__dsmStudioReplies[id] = resolve;
    setTimeout(() => { window.__dsmStudioReplies[id] && resolve({ ok: false, error: '操作超时' }); }, 8000);
    window.webkit.messageHandlers.dsmThemeStudio.postMessage(Object.assign({ replyId: id, action }, payload));
  });
}
function closeSelf() {
  if (window.themeStudio && window.themeStudio.close) window.themeStudio.close();
  else if (window.webkit && window.webkit.messageHandlers.dsmThemeStudio)
    window.webkit.messageHandlers.dsmThemeStudio.postMessage({ replyId: 'close' + Date.now(), action: 'close' });
}
document.getElementById('close').addEventListener('click', closeSelf);

/* ---------------- 颜色工具 ---------------- */
const hex2rgb = (h) => { h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const rgb2hex = (r,g,b) => '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); };
const tint = (h, t) => mix(h, '#ffffff', t);
const shade = (h, t) => mix(h, '#000000', t);
const rgba = (h, a) => { const [r,g,b] = hex2rgb(h); return `rgba(${r}, ${g}, ${b}, ${a})`; };
const alphaHex = (h, a) => { const [r,g,b] = hex2rgb(h); return `rgba(${r}, ${g}, ${b}, ${a})`; };

/* ---------------- 由三个主色推导完整令牌板 ---------------- */
function deriveTokens(accent, sun, mint, mode) {
  const dark = mode === 'dark';
  const ink = dark ? shade(accent, 0.78) : '#2b2620';
  const cream = dark ? tint(accent, 0.88) : '#f7f3ea';
  const slate = dark ? shade(accent, 0.35) : mix(accent, '#8a8172', 0.5);
  // 深色底向中性暗色靠拢, 避免高饱和主色(橙/红等)把背景染成浑浊的棕
  const baseInk = dark ? mix(ink, '#0e1114', 0.45) : shade(accent, 0.85);
  const baseCream = dark ? tint(accent, 0.92) : cream;
  const L = (a, b) => alphaHex(a, b);
  const v = {};
  v.coral = `  --dsm-coral: ${accent};`;
  v.sun = `  --dsm-sun: ${sun};`;
  v.mint = `  --dsm-mint: ${mint};`;
  v.slate = `  --dsm-slate: ${slate};`;
  v.ink = `  --dsm-ink: ${ink};`;
  v.cream = `  --dsm-cream: ${cream};`;
  v.wall = `  --dsm-reference-wall: linear-gradient(160deg, ${dark ? shade(accent,0.88) : tint(accent,0.94)} 0%, ${dark ? shade(accent,0.62) : tint(accent,0.86)} 45%, ${dark ? mix(accent, slate, 0.55) : mix(accent, '#ffffff', 0.72)} 100%);`;
  v.mascot = `  --dsm-mascot-ui: radial-gradient(circle at 35% 30%, ${tint(accent,0.55)}, ${accent} 55%, ${shade(accent,0.35)} 100%);`;
  // 深色板
  v.dk_bg_base = `  --dsw-alias-bg-base: ${L(baseInk, dark?0.88:0.86)} !important;`;
  v.dk_bg_l1 = `  --dsw-alias-bg-layer-1: ${L(dark?mix(baseInk,'#ffffff',0.05):baseInk, 0.93)} !important;`;
  v.dk_bg_l2 = `  --dsw-alias-bg-layer-2: ${L(dark?mix(baseInk,'#ffffff',0.12):mix(baseInk,accent,0.1), 0.90)} !important;`;
  v.dk_bg_ov = `  --dsw-alias-bg-overlay: ${L(baseInk, 0.96)} !important;`;
  v.dk_b_l1 = `  --dsw-alias-border-l1: ${L(mint, 0.20)} !important;`;
  v.dk_b_l2 = `  --dsw-alias-border-l2: ${L(sun, 0.30)} !important;`;
  v.dk_label_p = `  --dsw-alias-label-primary: ${dark?mix(cream,'#ffffff',0.16):mix(baseCream,'#000000',0.02)} !important;`;
  v.dk_label_pb = `  --dsw-alias-label-primary-bluish: ${tint(dark?cream:sun, 0.55)} !important;`;
  v.dk_label_pd = `  --dsw-alias-label-primary-dimmed: ${mix(cream, baseInk, 0.22)} !important;`;
  v.dk_label_s = `  --dsw-alias-label-secondary: ${mix(cream, baseInk, 0.38)} !important;`;
  v.dk_label_t = `  --dsw-alias-label-tertiary: ${mix(cream, baseInk, 0.52)} !important;`;
  v.dk_label_c = `  --dsw-alias-label-caption: ${mix(cream, baseInk, 0.60)} !important;`;
  v.dk_label_ld = `  --dsw-alias-label-dimmed: ${mix(cream, baseInk, 0.68)} !important;`;
  v.dk_err = `  --dsw-alias-state-error-primary: ${dark ? '#ff8a9a' : shade(accent, 0.02)} !important;`;
  v.dk_sidebar = `  --dsw-specific-sidebar-fill: ${L(baseInk, 0.93)} !important;`;
  v.dk_veil = `  --dsm-veil:\n    linear-gradient(90deg, ${L(baseInk,0.58)}, ${L(baseInk,0.42)} 52%, ${L(slate,0.30)});`;
  v.dk_glow = `  --dsm-accent-glow: ${L(accent, 0.38)};`;
  // 浅色板
  v.lt_bg_base = `  --dsw-alias-bg-base: ${L(baseCream, 0.86)} !important;`;
  v.lt_bg_l1 = `  --dsw-alias-bg-layer-1: ${L(tint(baseCream,0.25), 0.92)} !important;`;
  v.lt_bg_l2 = `  --dsw-alias-bg-layer-2: ${L(mix(baseCream, accent, 0.10), 0.86)} !important;`;
  v.lt_bg_ov = `  --dsw-alias-bg-overlay: ${L(tint(baseCream,0.2), 0.97)} !important;`;
  v.lt_b_l1 = `  --dsw-alias-border-l1: ${L(slate, 0.22)} !important;`;
  v.lt_b_l2 = `  --dsw-alias-border-l2: ${L(accent, 0.32)} !important;`;
  v.lt_brand = `  --dsw-alias-brand-primary: ${shade(accent, 0.05)} !important;`;
  v.lt_label_p = `  --dsw-alias-label-primary: ${ink} !important;`;
  v.lt_label_pb = `  --dsw-alias-label-primary-bluish: ${shade(mint, 0.45)} !important;`;
  v.lt_label_pd = `  --dsw-alias-label-primary-dimmed: ${mix(ink, baseCream, 0.25)} !important;`;
  v.lt_label_s = `  --dsw-alias-label-secondary: ${mix(ink, baseCream, 0.38)} !important;`;
  v.lt_label_t = `  --dsw-alias-label-tertiary: ${mix(ink, baseCream, 0.50)} !important;`;
  v.lt_label_c = `  --dsw-alias-label-caption: ${mix(ink, baseCream, 0.55)} !important;`;
  v.lt_label_ld = `  --dsw-alias-label-dimmed: ${mix(ink, baseCream, 0.62)} !important;`;
  v.lt_err = `  --dsw-alias-state-error-primary: ${shade(accent, 0.08)} !important;`;
  v.lt_ok = `  --dsw-alias-state-success-primary: ${shade(mint, 0.38)} !important;`;
  v.lt_warn = `  --dsw-alias-state-warn-primary: ${shade(sun, 0.42)} !important;`;
  v.lt_sidebar = `  --dsw-specific-sidebar-fill: ${L(baseCream, 0.88)} !important;`;
  v.lt_veil = `  --dsm-veil:\n    linear-gradient(90deg, ${L(baseCream,0.32)}, ${L(baseCream,0.20)} 54%, ${L(tint(mint,0.7),0.16)});`;
  v.lt_glow = `  --dsm-accent-glow: ${L(accent, 0.28)};`;
  // 级联锁 = 深/浅板
  v.lkdk_bg_base = v.dk_bg_base; v.lkdk_bg_l1 = v.dk_bg_l1; v.lkdk_bg_l2 = v.dk_bg_l2; v.lkdk_bg_ov = v.dk_bg_ov;
  v.lkdk_label_p = v.dk_label_p; v.lkdk_label_pb = v.dk_label_pb; v.lkdk_label_pd = v.dk_label_pd;
  v.lkdk_label_s = v.dk_label_s; v.lkdk_label_t = v.dk_label_t; v.lkdk_label_c = v.dk_label_c; v.lkdk_label_ld = v.dk_label_ld;
  v.lkdk_b_l1 = v.dk_b_l1; v.lkdk_b_l2 = v.dk_b_l2; v.lkdk_sidebar = v.dk_sidebar;
  v.lklt_bg_base = v.lt_bg_base; v.lklt_bg_l1 = v.lt_bg_l1; v.lklt_bg_l2 = v.lt_bg_l2; v.lklt_bg_ov = v.lt_bg_ov;
  v.lklt_sidebar = v.lt_sidebar;
  // 三栏
  v.col_ls = `  background: ${L(tint(baseCream,0.15), 0.94)} !important;`;
  v.col_lc = `  background: ${L(tint(baseCream,0.15), 0.78)} !important;`;
  v.col_lde = `  background: ${L(tint(baseCream,0.1), 0.86)} !important;`;
  v.col_ds = `  background: ${L(baseInk, 0.94)} !important;`;
  v.col_dc = `  background: ${L(baseInk, 0.82)} !important;`;
  v.col_dde = `  background: ${L(mix(baseInk,'#ffffff',0.04), 0.86)} !important;`;
  // 阅读玻璃
  v.read_lp = `  --dsw-alias-label-primary: ${mix(ink, baseCream, 0.08)} !important;`;
  v.read_ls = `  --dsw-alias-label-secondary: ${mix(ink, baseCream, 0.35)} !important;`;
  v.read_grad_l = `  background: linear-gradient(90deg,\n    ${L(tint(baseCream,0.2),0.94)} 0%,\n    ${L(tint(baseCream,0.2),0.88)} 68%,\n    ${L(tint(baseCream,0.2),0.72)} 100%);`;
  v.read_grad_d = `  background: linear-gradient(90deg,\n    ${L(baseInk,0.90)} 0%,\n    ${L(baseInk,0.84)} 68%,\n    ${L(baseInk,0.70)} 100%);`;
  // 指针柔光
  v.pg_mint = `    radial-gradient(24% 26% at var(--dsm-pointer-x, 78%) var(--dsm-pointer-y, 18%), ${L(mint,0.16)}, transparent 70%),`;
  v.pg_sun = `    radial-gradient(42% 36% at 86% 14%, ${L(sun,0.14)}, transparent 64%),`;
  v.pg_coral = `    radial-gradient(36% 34% at 10% 90%, ${L(accent,0.14)}, transparent 64%);`;
  return v;
}

function buildCSS(values) {
  let out = TEMPLATE;
  for (const t of TOKENS) {
    if (!(t in values)) throw new Error('缺少令牌 ' + t);
    out = out.split('__' + t.toUpperCase() + '__').join(values[t]);
  }
  if (out.includes('__WALL__')) out = out.split('__WALL__').join(values.wall);
  if (out.includes('__MASCOT__')) out = out.split('__MASCOT__').join(values.mascot);
  return out;
}

/* ---------------- 状态 ---------------- */
let wallpaperDataURL = null;
let mascotDataURL = null;
let phrases = [];
const $ = (id) => document.getElementById(id);

function currentMode() { return document.querySelector('#modeSeg button.on').dataset.mode; }

function refreshPreview() {
  const accent = $('cAccent').value, sun = $('cSun').value, mint = $('cMint').value;
  const dark = currentMode() === 'dark';
  const t = deriveTokens(accent, sun, mint, dark ? 'dark' : 'light');
  const grab = (line) => line.trim().replace(/^[a-z-]+:/, '').replace(/ !important;$/, '').replace(/;$/, '');
  const frame = $('pvFrame');
  const set = (k, val) => frame.style.setProperty(k, val);
  set('--pv-wall', wallpaperDataURL ? `url(${wallpaperDataURL}) center/cover` : grab(t.wall));
  set('--pv-label', grab(dark ? t.lkdk_label_p : t.lt_label_p));
  set('--pv-label2', grab(dark ? t.lkdk_label_s : t.lt_label_s));
  set('--pv-col', grab(dark ? t.col_ds : t.col_ls));
  set('--pv-center', grab(dark ? t.col_dc : t.col_lc));
  set('--pv-border', grab(dark ? t.lkdk_b_l1 : t.lt_b_l1));
  set('--pv-border2', grab(dark ? t.lkdk_b_l2 : t.lt_b_l2));
  set('--pv-l1', grab(dark ? t.lkdk_bg_l1 : t.lt_bg_l1));
  set('--pv-sel', `color-mix(in srgb, ${mint} 18%, transparent)`);
  set('--pv-accent', accent);
  set('--pv-sun', sun);
  set('--pv-ink', dark ? '#fff' : '#222');
  set('--pv-read', dark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.04)');
  set('--pv-readlabel', dark ? 'rgba(255,255,255,.88)' : 'rgba(0,0,0,.75)');
  set('--pv-mascot', mascotDataURL
    ? `url(${mascotDataURL}) center/cover`
    : `radial-gradient(circle at 35% 30%, ${tint(accent,0.55)}, ${accent} 55%, ${shade(accent,0.35)} 100%)`);
  document.documentElement.style.setProperty('--accent', accent);
}

/* ---------------- 交互 ---------------- */
['cAccent','cSun','cMint'].forEach(id => $(id).addEventListener('input', refreshPreview));
$('modeSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  $('modeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  refreshPreview();
}));
$('name').addEventListener('input', refreshPreview);

$('pickWall').addEventListener('click', () => $('wallFile').click());
$('wallFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const dataURL = await compressImage(file, 1600, 0.82);
    wallpaperDataURL = dataURL;
    const box = $('wallbox');
    box.innerHTML = `<img src="${dataURL}" alt=""><div class="row"><button class="mini" id="clearWall">移除图片</button></div>`;
    box.querySelector('#clearWall').addEventListener('click', () => { wallpaperDataURL = null; resetWallbox(); refreshPreview(); });
    refreshPreview();
  } catch (err) { setStatus('图片处理失败：' + err.message, true); }
});
function resetWallbox() {
  $('wallbox').innerHTML = `<div class="hint">上传一张喜欢的图片作为主题壁纸<br>支持 JPG / PNG，自动压缩</div>
    <div class="row" style="margin-top:8px"><button class="mini" id="pickWall">上传图片</button></div>`;
  $('wallbox').querySelector('#pickWall').addEventListener('click', () => $('wallFile').click());
}

$('pickMascot').addEventListener('click', () => $('mascotFile').click());
$('mascotFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const dataURL = await compressImage(file, 512, 0.9);
    mascotDataURL = dataURL;
    const box = $('mascotBox');
    box.innerHTML = `<img src="${dataURL}" alt="" style="max-height:96px"><div class="row"><button class="mini" id="clearMascot">移除图片</button></div>`;
    box.querySelector('#clearMascot').addEventListener('click', () => { mascotDataURL = null; resetMascotBox(); refreshPreview(); });
    refreshPreview();
  } catch (err) { setStatus('图片处理失败：' + err.message, true); }
});
function resetMascotBox() {
  $('mascotBox').innerHTML = `<div class="hint">上传吉祥物图片，用作侧栏头像、欢迎页形象<br>以及桌面小宠物和应用图标 · 建议方形 PNG</div>
    <div class="row" style="margin-top:8px"><button class="mini" id="pickMascot">上传图片</button></div>`;
  $('mascotBox').querySelector('#pickMascot').addEventListener('click', () => $('mascotFile').click());
}
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法读取图片')); };
    img.src = url;
  });
}

$('phraseInput').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = e.target.value.trim();
  if (!v) return;
  if (phrases.includes(v)) { e.target.value = ''; return; }
  if (phrases.length >= 8) { setStatus('最多 8 句口头禅', true); return; }
  phrases.push(v);
  e.target.value = '';
  renderPhrases();
});
function renderPhrases() {
  $('phraseList').innerHTML = phrases.map((p, i) =>
    `<span class="chip">${p.replace(/</g,'&lt;')}<b data-i="${i}">×</b></span>`).join('');
  $('phraseList').querySelectorAll('b').forEach(b => b.addEventListener('click', () => {
    phrases.splice(+b.dataset.i, 1); renderPhrases();
  }));
}

const PRESETS = [
  { name: '正太', accent: '#f36b50', sun: '#f5dc26', mint: '#62e8d3', mode: 'dark' },
  { name: '暗夜极光', accent: '#8b7cf6', sun: '#4cc9f0', mint: '#55d8c2', mode: 'dark' },
  { name: '奶油纸感', accent: '#e07856', sun: '#e8b04b', mint: '#6fae9e', mode: 'light' },
  { name: '深海鲸语', accent: '#4da3ff', sun: '#ffd166', mint: '#6fe3d4', mode: 'dark' },
  { name: '樱花粉雾', accent: '#f078a8', sun: '#ffd166', mint: '#7fd4c1', mode: 'light' },
  { name: '森林清晨', accent: '#4a9e6f', sun: '#d9c26a', mint: '#9fd6a8', mode: 'light' },
];
$('presetGrid').innerHTML = PRESETS.map((p, i) =>
  `<div class="preset" data-i="${i}"><div class="sw"><i style="background:${p.accent}"></i><i style="background:${p.sun}"></i><i style="background:${p.mint}"></i></div><div>${p.name}</div></div>`).join('');
$('presetGrid').querySelectorAll('.preset').forEach(el => el.addEventListener('click', () => {
  const p = PRESETS[+el.dataset.i];
  $('cAccent').value = p.accent; $('cSun').value = p.sun; $('cMint').value = p.mint;
  $('modeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.mode === p.mode));
  refreshPreview();
}));

function setStatus(msg, isErr) {
  const s = $('status');
  s.textContent = msg || '';
  s.className = 'status' + (isErr ? ' err' : '');
  if (msg && !isErr) setTimeout(() => { if (s.textContent === msg) s.textContent = ''; }, 3500);
}

async function collectPayload(applyNow) {
  const name = $('name').value.trim() || '我的主题';
  const values = deriveTokens($('cAccent').value, $('cSun').value, $('cMint').value, currentMode());
  if (wallpaperDataURL) values.wall = `  --dsm-reference-wall: url("${wallpaperDataURL}");`;
  if (mascotDataURL) values.mascot = `  --dsm-mascot-ui: url("${mascotDataURL}") !important;`;
  const css = buildCSS(values);
  return {
    id: 'custom-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name,
    createdAt: Date.now(),
    mode: currentMode(),
    colors: { accent: $('cAccent').value, sun: $('cSun').value, mint: $('cMint').value },
    wallpaper: wallpaperDataURL,
    mascot: mascotDataURL,
    welcome: $('welcome').value.trim(),
    phrases,
    css,
    apply: !!applyNow
  };
}

$('save').addEventListener('click', () => doSave(false));
$('saveApply').addEventListener('click', () => doSave(true));
async function doSave(applyNow) {
  const btn = $(applyNow ? 'saveApply' : 'save');
  btn.disabled = true;
  try {
    const payload = await collectPayload(applyNow);
    const r = await bridgeCall('save', payload);
    if (r && r.ok) {
      setStatus(applyNow ? '已保存并应用' : '主题已保存');
      loadSaves();
    } else setStatus((r && r.error) || '保存失败', true);
  } catch (e) { setStatus('保存失败：' + e.message, true); }
  btn.disabled = false;
}

async function loadSaves() {
  const r = await bridgeCall('list');
  const box = $('saveList');
  if (!r || !r.ok || !r.themes || !r.themes.length) {
    box.innerHTML = '<div class="empty">还没有自定义主题</div>';
    return;
  }
  box.innerHTML = r.themes.map(t =>
    `<div class="save-row" data-id="${t.id}"><span class="dot" style="background:${t.colors && t.colors.accent || '#ccc'}"></span>
     <span class="nm">${String(t.name || '').replace(/</g,'&lt;')}</span>
     <button class="apply">使用</button><button class="del">删除</button></div>`).join('');
  box.querySelectorAll('.save-row').forEach(row => {
    row.querySelector('.apply').addEventListener('click', async () => {
      const res = await bridgeCall('apply', { id: row.dataset.id });
      setStatus(res && res.ok ? '已切换到该主题' : ((res && res.error) || '切换失败'), !res || !res.ok);
    });
    row.querySelector('.del').addEventListener('click', async () => {
      const res = await bridgeCall('remove', { id: row.dataset.id });
      setStatus(res && res.ok ? '已删除' : ((res && res.error) || '删除失败'), !res || !res.ok);
      if (res && res.ok) loadSaves();
    });
  });
}

renderPhrases();
refreshPreview();
loadSaves().catch(() => {});
</script>
