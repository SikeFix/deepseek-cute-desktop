<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>插件市场</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#30261f;background:#fffaf0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 88% 4%,#ffe84d44,transparent 35%),linear-gradient(145deg,#fffaf0,#f3e8d4)}
    main{max-width:980px;margin:auto;padding:34px 38px 42px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}h1{margin:0;font-size:28px}p{line-height:1.55}.lead{margin:8px 0 26px;color:#6e5d50}.actions{display:flex;gap:8px}button{border:0;border-radius:11px;padding:9px 13px;background:#e8ddd0;color:#574b43;font:700 12px inherit;cursor:pointer}button.primary{background:#f36a50;color:white;box-shadow:4px 4px 0 #f3dc21}button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{padding:18px;border:1px solid #ddcdb9;border-radius:18px;background:#fffdf8cc;box-shadow:0 8px 18px #76533c12}.card h2{margin:0 0 6px;font-size:17px}.meta{color:#75665c;font-size:12px}.desc{min-height:48px;color:#62574f;font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{padding:4px 7px;border-radius:999px;background:#55d8c233;color:#087c6d;font-size:11px;font-weight:700}.status{margin-top:12px;color:#76685e;font-size:12px}.empty,.error{padding:24px;border:1px dashed #d0bdab;border-radius:16px;color:#74665b;background:#fffdf877}.error{color:#ad3a30;border-color:#e6a49b}.foot{margin-top:22px;color:#88776b;font-size:11px}.source{color:#087c6d;text-decoration:none}.modal{display:none;position:fixed;inset:0;background:#30261f55;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(560px,100%);padding:24px;border-radius:20px;background:#fffdf8;box-shadow:0 24px 70px #30261f55}.dialog h2{margin-top:0}.dialog .perm{padding:10px;border-radius:10px;background:#f3e8d4;color:#6e5d50;font-size:12px}
  </style>
</head>
<body><main><header><div><h1>插件市场</h1><p class="lead">只显示经过 GitHub 审核合并的官方 DeepSeek 内核插件。安装后需要重启本地服务才会生效。</p></div><div class="actions"><button id="refresh">刷新目录</button><button id="close">关闭</button></div></header><section id="content" class="grid"><div class="empty">正在读取审核目录…</div></section><p class="foot">插件来源固定为 GitHub Release，安装前会校验 SHA-256。插件运行在本地 DeepSeek 内核进程中，请只安装你信任的已审核插件。</p></main><div id="modal" class="modal"><div class="dialog"><h2 id="modalTitle">安装插件</h2><p id="modalText"></p><div id="modalPerm" class="perm"></div><footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button id="cancel">取消</button><button id="confirm" class="primary">确认安装</button></footer></div></div><script>
const content=document.querySelector('#content'), modal=document.querySelector('#modal'), modalText=document.querySelector('#modalText'), modalPerm=document.querySelector('#modalPerm'), confirm=document.querySelector('#confirm'); let pending;
const bridge=window.pluginMarket||(()=>{let seq=0;window.__pluginMarketReplies={};window.__pluginMarketReply=(id,result)=>{const resolve=window.__pluginMarketReplies[id];if(resolve){delete window.__pluginMarketReplies[id];resolve(result);}};const request=(action,payload={})=>new Promise(resolve=>{const id=String(++seq);window.__pluginMarketReplies[id]=resolve;window.webkit.messageHandlers.dsmPluginMarket.postMessage({...payload,action,replyId:id});});return{list:()=>request('list'),install:p=>request('install',p),disable:p=>request('disable',p),enable:p=>request('enable',p),uninstall:p=>request('uninstall',p),close:()=>request('close')}})();
const text=(v,lang='zh-CN')=>typeof v==='string'?v:(v?.[lang]||v?.en||'');
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(data){const plugins=(data.catalog?.plugins||[]).filter(p=>(p.platforms||[]).includes(data.platform)); const installed=data.installed||{}; if(!plugins.length){content.innerHTML='<div class="empty">当前还没有适用于本平台的已审核插件。插件作者可以通过 GitHub PR 提交，审核合并后会出现在这里。</div>';return;} content.innerHTML=plugins.map(p=>{const state=installed[p.id]; const status=state?.status==='disabled'?'已停用':state?.status==='update-available'?`有新版本 · 当前 ${esc(state.version)}`:state?`已安装 ${esc(state.version)}`:'未安装'; const action=state?.status==='update-available'?`<button class="primary" data-action="install" data-id="${esc(p.id)}">更新到 ${esc(p.version)}</button><button data-action="uninstall" data-id="${esc(p.id)}">卸载</button>`:state?`<button data-action="toggle" data-id="${esc(p.id)}">${state.status==='disabled'?'启用':'停用'}</button><button data-action="uninstall" data-id="${esc(p.id)}">卸载</button>`:`<button class="primary" data-action="install" data-id="${esc(p.id)}">一键安装</button>`; return `<article class="card"><h2>${esc(text(p.name))}</h2><div class="meta">${esc(p.author||'社区作者')} · v${esc(p.version)} · ${esc(p.license)}</div><p class="desc">${esc(text(p.description))}</p><div class="tags">${(p.permissions||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="meta">支持：${esc((p.platforms||[]).join('、'))}</div><div class="status">${status}</div><div class="actions" style="margin-top:12px">${action}<a class="source" target="_blank" href="${esc(p.repository)}">GitHub</a></div></article>`}).join('');}
async function load(){content.innerHTML='<div class="empty">正在读取审核目录…</div>';const result=await bridge.list();if(!result?.ok){content.innerHTML=`<div class="error">${esc(result?.error||'目录读取失败')}<br>网络不可用时会继续使用本地缓存。</div>`;return;}render(result);}
content.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const p=(window.__catalog||[]).find(x=>x.id===b.dataset.id);if(b.dataset.action==='install'){pending={type:'install',id:b.dataset.id};modalText.textContent=`将从 ${p?.repository||'审核目录'} 下载固定版本 ${p?.version||''}。`;modalPerm.textContent=`权限：${(p?.permissions||[]).join('、')||'无额外声明权限'}。安装后需要重启本地服务。`;modal.classList.add('open');}else{bridge[b.dataset.action==='toggle'?(window.__installed?.[b.dataset.id]?.status==='disabled'?'enable':'disable'):'uninstall']({id:b.dataset.id}).then(load);}});
document.querySelector('#refresh').onclick=load;document.querySelector('#close').onclick=()=>bridge.close();document.querySelector('#cancel').onclick=()=>modal.classList.remove('open');confirm.onclick=async()=>{confirm.disabled=true;const r=await bridge.install({id:pending.id});confirm.disabled=false;modal.classList.remove('open');if(!r?.ok)alert(r?.error||'安装失败');else alert('插件已安装。请重启本地服务后生效。');load();};
const oldRender=render;render=(data)=>{window.__catalog=data.catalog?.plugins||[];window.__installed=data.installed||{};oldRender(data);};load();
</script></body></html>
