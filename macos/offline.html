<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSeek</title>
<style>
:root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
* { box-sizing: border-box; } html,body { width:100%; height:100%; margin:0; }
body { display:grid; place-items:center; background:Canvas; color:CanvasText; }
.card { width:min(520px,calc(100vw - 48px)); padding:32px; text-align:center; border:1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius:12px; }
h1 { margin:0 0 12px; font-size:24px; font-weight:600; } p { margin:10px 0; color:GrayText; line-height:1.6; }
button { margin-top:18px; padding:9px 16px; border:1px solid color-mix(in srgb, CanvasText 28%, transparent); border-radius:7px; color:ButtonText; background:ButtonFace; cursor:pointer; }
</style></head>
<body><main class="card"><h1>DeepSeek</h1><p id="message">正在等待本地服务启动…</p><p id="status"></p><button id="retry">重试</button></main>
<script>
const message=document.getElementById('message'); const status=document.getElementById('status'); const q=new URLSearchParams(location.search).get('message'); if(q) message.textContent=q;
window.__dsmSetServiceStatus=function(state){ status.textContent=state==='online'?'本地服务已连接，正在进入主界面…':state==='starting'?'正在启动本地服务…':'本地服务暂时不可用，请重试。'; };
document.getElementById('retry').onclick=function(){ message.textContent='正在重试…'; window.webkit?.messageHandlers?.dsmService?.postMessage('recover'); };
</script></body></html>
